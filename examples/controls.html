<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>glazy - live controls</title>
  <style>
    body { margin: 0; background: #faf7f2; font: 13px system-ui, sans-serif; color: #2b2b2b; }
    #stage { position: relative; width: 100vw; height: 56vh; }
    .panel { padding: 12px 16px 28px; }
    .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; max-width: 1100px; margin: 0 auto; }
    fieldset { border: 1px solid #e4ddd0; border-radius: 8px; padding: 10px 12px; margin: 0; }
    legend { font-weight: 600; color: #b03a4a; padding: 0 4px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
    label > span { color: #555; white-space: nowrap; }
    input[type="range"] { width: 110px; }
    input[type="color"] { width: 38px; height: 22px; padding: 0; border: 1px solid #ccc; }
    input[type="text"], input[type="number"], select { font: inherit; padding: 2px 4px; max-width: 130px; }
    .actions { text-align: center; margin: 14px 0 0; }
    button { font: inherit; padding: 6px 14px; border: 1px solid #b03a4a; background: #b03a4a; color: #fff; border-radius: 6px; cursor: pointer; }
    button.secondary { background: #fff; color: #b03a4a; }
  </style>
</head>
<body>
  <div id="stage"></div>

  <div class="panel">
    <div class="groups">
      <fieldset>
        <legend>Shape &amp; preset</legend>
        <label><span>shape</span>
          <select id="shape"><option>ring</option><option>bar</option><option>old-fashioned</option><option>cruller</option></select></label>
        <label><span>preset</span>
          <select id="preset"><option value="">(none)</option><option>strawberry</option><option>blueberry</option><option>matcha</option><option>chocolate</option></select></label>
        <label><span>seed</span><input type="number" id="seed" placeholder="random"></label>
      </fieldset>

      <fieldset>
        <legend>Colors</legend>
        <label><span>frost / glaze</span><input type="color" id="frost" value="#ed4359"></label>
        <label><span>dough</span><input type="color" id="dough" value="#df9f48"></label>
        <label><span>fill light</span><input type="color" id="fill" value="#ffe6ef"></label>
      </fieldset>

      <fieldset>
        <legend>Frosting</legend>
        <label><span>finish</span><select id="finish"><option>glaze</option><option>frosting</option><option>plain</option><option>none</option></select></label>
        <label><span>roughness</span><input type="range" id="frostRoughness" min="0" max="1" step="0.02" value="0.3"></label>
        <label><span>clearcoat</span><input type="range" id="frostClearcoat" min="0" max="1" step="0.02" value="1"></label>
        <label><span>texture scale</span><input type="range" id="glazeTextureScale" min="0" max="3" step="0.1" value="1"></label>
      </fieldset>

      <fieldset>
        <legend>Dough</legend>
        <label><span>roughness</span><input type="range" id="doughRoughness" min="0" max="1" step="0.02" value="0.82"></label>
        <label><span>grain</span><input type="range" id="doughGrain" min="0" max="3" step="0.1" value="1"></label>
        <label><span>crust</span><input type="range" id="crust" min="0" max="2" step="0.1" value="1"></label>
      </fieldset>

      <fieldset>
        <legend>Toppings</legend>
        <label><span>type</span><select id="topping"><option>sprinkles</option><option>nuts</option><option>coconut</option><option>none</option></select></label>
        <label><span>count</span><input type="range" id="toppingCount" min="0" max="400" step="10" value="150"></label>
        <label><span>sprinkle colors</span><input type="text" id="sprinkleColors" placeholder="#fff,#ed4359,..."></label>
        <label><span>nut colors</span><input type="text" id="nutColors" placeholder="#e6c89a,..."></label>
        <label><span>coconut colors</span><input type="text" id="coconutColors" placeholder="#fffaf0,..."></label>
      </fieldset>

      <fieldset>
        <legend>Motion - spin</legend>
        <label><span>enabled</span><input type="checkbox" id="spin" checked></label>
        <label><span>speed</span><input type="range" id="spinSpeed" min="0" max="0.02" step="0.001" value="0.004"></label>
        <label><span>direction</span><select id="spinDir"><option value="1">1</option><option value="-1">-1</option></select></label>
      </fieldset>

      <fieldset>
        <legend>Motion - wobble &amp; bob</legend>
        <label><span>wobble</span><input type="checkbox" id="wobble" checked></label>
        <label><span>wobble amp</span><input type="range" id="wobbleAmp" min="0" max="0.2" step="0.01" value="0.05"></label>
        <label><span>bob</span><input type="checkbox" id="bob" checked></label>
        <label><span>bob amp</span><input type="range" id="bobAmp" min="0" max="0.15" step="0.01" value="0.045"></label>
      </fieldset>

      <fieldset>
        <legend>Motion - lean</legend>
        <label><span>enabled</span><input type="checkbox" id="lean" checked></label>
        <label><span>strength</span><input type="range" id="leanStrength" min="0" max="0.5" step="0.02" value="0.16"></label>
        <label><span>source</span><select id="leanSource"><option>window</option><option>element</option></select></label>
        <label><span>reduced motion</span><select id="reducedMotion"><option>auto</option><option>true</option><option>false</option></select></label>
      </fieldset>

      <fieldset>
        <legend>Render</legend>
        <label><span>pixel-ratio cap</span><input type="range" id="pixelRatioCap" min="1" max="3" step="0.5" value="2"></label>
      </fieldset>
    </div>

    <div class="actions">
      <button id="shot">Screenshot PNG</button>
      <button id="reset" class="secondary">Reset</button>
    </div>
  </div>

  <!-- UMD globals so the page works opened directly as a file (no server needed) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="../dist/glazy.umd.js"></script>
  <script>
    const { DonutRenderer, presets } = Glazy;

    const $ = (id) => document.getElementById(id);
    const val = (id) => $(id).value;
    const num = (id) => parseFloat(val(id));
    const on = (id) => $(id).checked;
    const list = (id) => val(id).split(',').map((s) => s.trim()).filter(Boolean);
    const toHex = (n) => '#' + (n >>> 0).toString(16).padStart(6, '0');

    function gather() {
      const o = {
        three: THREE,
        shape: val('shape'),
        frost: val('frost'), dough: val('dough'), fillLight: val('fill'),
        frostFinish: val('finish'),
        frostRoughness: num('frostRoughness'), frostClearcoat: num('frostClearcoat'),
        glazeTextureScale: num('glazeTextureScale'),
        doughRoughness: num('doughRoughness'), doughGrain: num('doughGrain'), crust: num('crust'),
        topping: val('topping'), toppingCount: num('toppingCount'),
        pixelRatioCap: num('pixelRatioCap'),
        seed: val('seed') === '' ? null : parseInt(val('seed'), 10),
        reducedMotion: val('reducedMotion') === 'auto' ? 'auto' : val('reducedMotion') === 'true',
        motion: {
          spin: { enabled: on('spin'), speed: num('spinSpeed'), direction: parseInt(val('spinDir'), 10) },
          wobble: { enabled: on('wobble'), amplitude: num('wobbleAmp') },
          bob: { enabled: on('bob'), amplitude: num('bobAmp') },
          lean: { enabled: on('lean'), strength: num('leanStrength'), source: val('leanSource') },
        },
      };
      const sc = list('sprinkleColors'); if (sc.length) o.sprinkleColors = sc;
      const nc = list('nutColors'); if (nc.length) o.nutColors = nc;
      const cc = list('coconutColors'); if (cc.length) o.coconutColors = cc;
      return o;
    }

    const stage = $('stage');
    let donut = new DonutRenderer(stage, gather());

    // Debounced apply: setOptions rebuilds the donut, so coalesce rapid input.
    let timer = 0;
    const apply = () => { clearTimeout(timer); timer = setTimeout(() => donut.setOptions(gather()), 40); };

    // Load a preset's values INTO the controls (controls stay the source of truth,
    // so they don't fight the preset via the defaults<preset<explicit order).
    function loadPreset(name) {
      const p = presets[name];
      if (!p) return;
      if (p.frost != null) $('frost').value = toHex(p.frost);
      if (p.dough != null) $('dough').value = toHex(p.dough);
      if (p.fillLight != null) $('fill').value = toHex(p.fillLight);
      if (p.frostFinish) $('finish').value = p.frostFinish;
      if (p.topping) $('topping').value = p.topping;
    }

    $('preset').addEventListener('change', (e) => { loadPreset(e.target.value); apply(); });
    document.querySelectorAll('input, select').forEach((el) => {
      if (el.id === 'preset') return;
      el.addEventListener('input', apply);
    });

    $('shot').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = donut.screenshot();
      a.download = 'donut.png';
      a.click();
    });
    $('reset').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
